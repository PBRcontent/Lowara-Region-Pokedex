<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Region Pokédex</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="logo">✦ MY REGION <small>POKÉDEX</small></div><span>Jouw eigen Pokémonwereld</span></header>
<main><section class="intro"><p>JOUW WERELD · JOUW POKÉMON</p><h1>Ontdek jouw <em>eigen regio.</em></h1><div>Zoek een Pokémon, bekijk zijn artwork en klik erop voor alle informatie.</div></section>
<section class="dex"><h2>Regionale Pokédex</h2><div class="filters"><input id="search" placeholder="Zoek Pokémon op naam of nummer..."><select id="type"><option value="">Alle types</option></select><select id="generation"><option value="">Alle generaties</option></select><label><input type="checkbox" id="shiny"> Shiny bekijken</label><button id="favOnly">♡ Favorieten</button></div><p id="count"></p><div id="grid" class="grid"></div></section></main>
<div id="modal" class="backdrop hidden"><article class="modal"><button id="close" class="close">×</button><div id="details"></div></article></div>
<footer>MY REGION POKÉDEX · Fanproject voor jouw eigen regio</footer><script src="script.js"></script></body></html>
